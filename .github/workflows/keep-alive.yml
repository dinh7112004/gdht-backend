name: Keep Render Awake

on:
  schedule:
    # Chạy mỗi 14 phút (Render ngủ sau 15 phút)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Cho phép chạy thủ công để test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://gdht-backend.onrender.com/ > /dev/null
          echo "Poked Render at $(date)"
